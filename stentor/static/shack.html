<title>Stentor Shack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: instrument strip, three status modules, then the working bench: last heard | codeplug editor with side drawer */
:root{
  --paper:#e9eeec; --panel:#f7f9f8; --ink:#14232b; --muted:#5b6b70; --line:#cbd5d2;
  --accent:#0e6e74; --accent-soft:#d3e8e7; --tx:#c25a12; --ok:#2f7d3e; --warn:#a86b00; --bad:#b3261e;
  --chip:#e0e7e5; --sel:#fff3e6;
  --display:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f171a; --panel:#162227; --ink:#e3ecea; --muted:#93a5a8; --line:#2a3a40;
  --accent:#4fb8bd; --accent-soft:#17383b; --tx:#f08a43; --ok:#6cc27b; --warn:#e3b04b; --bad:#ff7a6e; --chip:#1f2e33; --sel:#3a2a1c; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f171a; --panel:#162227; --ink:#e3ecea; --muted:#93a5a8; --line:#2a3a40;
  --accent:#4fb8bd; --accent-soft:#17383b; --tx:#f08a43; --ok:#6cc27b; --warn:#e3b04b; --bad:#ff7a6e; --chip:#1f2e33; --sel:#3a2a1c; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:.01em}
.mono,td.num,.freq{font-family:var(--mono);font-variant-numeric:tabular-nums}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 12px;white-space:nowrap}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--panel);font-weight:600}
button.danger{color:var(--bad);border-color:var(--bad)}
button.tx{background:var(--tx);border-color:var(--tx);color:#fff;font-weight:600}
button.small{padding:2px 8px;font-size:12px}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select,input[type=text],input[type=number],textarea{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0;max-width:100%}
input[type=number]{font-family:var(--mono)}
/* strip */
.strip{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;border-bottom:2px solid var(--ink);padding-bottom:12px}
.call{font-family:var(--display);font-weight:700;font-size:clamp(30px,6vw,44px);line-height:1;letter-spacing:.04em}
.call small{display:block;font-family:var(--body);font-size:13px;font-weight:500;letter-spacing:0;color:var(--muted);margin-top:6px}
.strip-right{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;background:var(--chip);white-space:nowrap}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)} .pill.idle{color:var(--muted)}
/* modules */
.modules{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.module,.pane{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.module header,.pane header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.module h2,.pane h2{font-size:17px}
.fresh{font-size:11px;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.freqpair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.freqbox{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--paper)}
.freqbox .freq{font-size:18px;font-weight:600}
.freqbox .freq.tx{color:var(--tx)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--chip);border-radius:6px;padding:2px 8px;font-size:12px;font-family:var(--mono)}
.chip b{font-family:var(--body);font-weight:600}
.note{font-size:12.5px;color:var(--muted)}
.err{border-left:3px solid var(--bad);padding:6px 10px;background:var(--chip);border-radius:4px;font-size:13px}
.okbox{border-left:3px solid var(--ok);padding:6px 10px;background:var(--chip);border-radius:4px;font-size:13px}
.syncstate{font-family:var(--display);font-size:20px;font-weight:600}
.syncstate.ok{color:var(--ok)} .syncstate.warn{color:var(--warn)}
.confirm{border:1px dashed var(--tx);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.end{justify-content:flex-end}
.grow{flex:1 1 auto}
.diffl{margin:0;padding-left:18px;font-size:13px}
.diffl li{overflow-wrap:anywhere}
pre.diff{font-family:var(--mono);font-size:11.5px;line-height:1.35;max-height:320px;overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:8px;margin:0;white-space:pre}
pre.diff .add{color:var(--ok)} pre.diff .del{color:var(--bad)} pre.diff .hunk{color:var(--muted)}
/* bench */
.bench{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.pane.compact{padding:8px 16px;gap:6px}
.pane.compact h2{font-size:14px}
.pane.compact table{font-size:12px}
.pane.compact td,.pane.compact th{padding:3px 8px}
.tablewrap{overflow-x:auto}
.fm-name{width:13em;max-width:100%;padding:3px 6px}
.area{white-space:nowrap}
td.nm{white-space:nowrap}
img.logo{height:18px;width:auto;max-width:48px;vertical-align:middle;margin-right:6px;border-radius:3px;background:#fff}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.rowbtn{cursor:pointer}
tbody tr.rowbtn:hover td{background:var(--accent-soft)}
tbody tr.selected td{background:var(--sel)}
td.call{font-family:var(--mono);font-weight:600;font-size:13px;letter-spacing:0}
td.acts{white-space:nowrap;text-align:right}
.src{font-size:11px;font-weight:600;border-radius:4px;padding:1px 6px;background:var(--chip)}
.live{font-size:11px;font-weight:600;white-space:nowrap}
.live.ok{color:var(--ok)}.live.mid{color:var(--warn)}.live.old,.live.none{color:var(--muted)}
.live::before{content:"●";margin-right:3px}.live.none::before{content:"○"}
.src.rf{color:var(--tx)} .src.net{color:var(--accent)}
.ts{display:inline-block;min-width:30px;text-align:center;font-size:11px;font-weight:600;border-radius:4px;padding:1px 4px;background:var(--accent-soft);color:var(--accent)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:6px 10px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.cpgrid{display:grid;grid-template-columns:minmax(160px,230px) minmax(0,1fr);gap:12px}
@media (max-width:620px){.cpgrid{grid-template-columns:minmax(0,1fr)}}
.fmgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.fmgrid{grid-template-columns:minmax(0,1fr)}}
.zones{display:flex;flex-direction:column;gap:4px;max-height:520px;overflow:auto}
.zones button{text-align:left;display:flex;justify-content:space-between;gap:8px;border-radius:6px}
.zones button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.zones .n{font-family:var(--mono);color:var(--muted);font-size:12px}
.managed{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--accent)}
.empty{color:var(--muted);font-size:13px;padding:10px 0}
.skel{color:var(--muted)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
img.flag{height:18px;width:auto;border-radius:2px;box-shadow:0 0 0 1px var(--line);vertical-align:-3px;margin-left:4px}
#brand-flag img.flag{height:22px;vertical-align:-4px;margin-left:8px}
td.call img.flag{height:13px;margin:0 5px 0 0;vertical-align:-2px}
.lang{font-weight:700;letter-spacing:.04em;padding:3px 8px}
.toolbar .sep{width:1px;height:22px;background:var(--line)}
/* drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);background:var(--panel);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.18);padding:16px max(16px,env(safe-area-inset-right,0px)) 24px 16px;overflow:auto;z-index:20;display:flex;flex-direction:column;gap:12px;
  padding-top:calc(16px + env(safe-area-inset-top,0px))}
.drawer h3{font-size:16px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
.form label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
.form label.full{grid-column:1/-1}
.form input,.form select{width:100%}
.form .check{flex-direction:row;align-items:center;gap:6px;color:var(--ink)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:19}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:8px;font-size:13px;z-index:30;max-width:90vw}
.list{display:flex;flex-direction:column;gap:4px;max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:6px}
.list label{display:flex;gap:6px;align-items:center;font-size:13px}
.progress{height:6px;background:var(--chip);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;width:40%;background:var(--accent);animation:slide 1.4s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
@media (prefers-reduced-motion:reduce){.progress i{animation:none;width:100%}}
@media (prefers-reduced-motion:no-preference){.pulse{animation:pulse 1.6s ease-in-out infinite}@keyframes pulse{50%{opacity:.45}}}
</style>
<script>/* theme before first paint (no flash); default dark, light only if explicitly chosen */
try{var t=localStorage.getItem("stentor.theme");}catch(e){}document.documentElement.dataset.theme=(t==="light"?"light":"dark");</script>

<div class="wrap">
  <div class="strip">
    <div class="call" id="brand">Stentor<span id="brand-flag" class="flag"></span><small id="brand-sub">web CPS · DMR</small></div>
    <div class="strip-right">
      <span class="pill idle" id="pill-radio">Ασύρματος …</span>
      <span class="pill idle" id="pill-hs">Hotspot …</span>
      <span class="pill idle" id="pill-bm">BrandMeister …</span>
      <span class="pill idle" id="pill-sync">Sync …</span>
      <button class="small" id="btn-theme" title="Theme / Θέμα" aria-label="Theme">☀</button>
      <button class="small lang" id="btn-lang" title="Language / Γλώσσα">EN</button>
    </div>
  </div>
  <div class="err" id="page-err" hidden></div>

  <div class="modules">
    <section class="module"><header><h2>Hotspot</h2><span class="fresh" id="f-hs"></span></header><div id="hs-body"><div class="skel pulse">Διαβάζω το WPSD…</div></div></section>
    <section class="module"><header><h2>BrandMeister</h2><span class="fresh" id="f-bm"></span></header><div id="bm-body"><div class="skel pulse">Ρωτάω το BrandMeister…</div></div></section>
    <section class="module"><header><h2>WPSD → Anytone</h2><span class="fresh" id="f-sync"></span></header><div id="sync-body"><div class="skel pulse">Συγκρίνω…</div></div></section>
  </div>

  <div class="bench">
    <section class="pane compact" id="lh-pane">
      <header><h2>Last heard</h2><div class="row"><label class="note"><input type="checkbox" id="rf-only"> Μόνο από τον ασύρματο (RF)</label><label class="note"><input type="checkbox" id="lh-live"> Live</label><button class="small" id="lh-more">Περισσότερα</button><span class="fresh" id="f-lh"></span></div></header>
      <div class="tablewrap" id="lh-body"><div class="skel pulse">Φορτώνω…</div></div>
    </section>

    <section class="pane" id="cp-pane">
      <header>
        <h2>Codeplug</h2>
        <div class="toolbar">
          <select id="cp-select" title="Αρχείο codeplug"><option>…</option></select>
          <span class="sep"></span>
          <button id="btn-read" title="Διαβάζει τον ασύρματο και αποθηκεύει backup στο NAS">⟵ Read</button>
          <button id="btn-write" class="tx" title="Γράφει το επιλεγμένο αρχείο στον ασύρματο (με προεπισκόπηση)">Write ⟶</button>
          <button id="btn-contacts" title="Γράφει τη λίστα Digital Contacts (RadioID) στον ασύρματο">☎ Digital Contacts</button>
          <button id="btn-validate" title="Έλεγχος εγκυρότητας με dmrconf">Έλεγχος</button>
          <button id="btn-revert" title="Επαναφορά του current από το τελευταίο read">Επαναφορά</button>
          <span class="sep"></span>
          <button id="btn-export-cps" title="Κατεβάζει το codeplug ως CSV για εισαγωγή στο AnyTone CPS (zip)">⇩ CPS CSV</button>
          <button id="btn-import-rdt" title="Ανεβάζει ένα .rdt του AnyTone CPS και το μετατρέπει σε codeplug">⇧ .rdt</button>
          <input type="file" id="rdt-file" accept=".rdt" hidden>
          <span class="sep"></span>
          <button id="btn-bridge" title="Σύνδεσε τον ασύρματο στη USB αυτού του υπολογιστή και προγραμμάτισέ τον μέσα από τον browser (Chrome/Edge)">⚡ Σύνδεση</button>
        </div>
      </header>
      <div class="note" id="cp-meta"></div>
      <div id="radio-op" hidden></div>
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="zones" aria-selected="true">Zones</button>
        <button role="tab" data-tab="channels">Κανάλια</button>
        <button role="tab" data-tab="contacts">Επαφές / TG</button>
        <button role="tab" data-tab="grouplists">RX Group lists</button>
        <button role="tab" data-tab="scanlists">Scan lists</button>
        <button role="tab" data-tab="fm">FM Radio</button>
        <button role="tab" data-tab="rpt">Αναμεταδότες</button>
        <button role="tab" data-tab="preset">Βιβλιοθήκη</button>
      </div>
      <div id="cp-body"><div class="skel pulse">Φορτώνω το codeplug…</div></div>
    </section>
  </div>
</div>
<div id="drawer-root"></div>
<div id="toast-root"></div>

const fmtF = (v) => { const n = parseFloat(v); return isFinite(n) ? n.toFixed(4) : "—"; };
const numF = (v) => { const n = parseFloat(v); return isFinite(n) ? n : null; };
async function api(tool, input){
  let r;
  try { r = await fetch("api/tool/" + tool, { method: "POST", headers: { "Content-Type": "application/json", "X-Shack": "1" }, body: JSON.stringify(input || {}) }); }
  catch (e) { throw { code: "server_unavailable", message: String(e) }; }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw { code: r.status === 401 || r.status === 403 ? "needs_reauth" : "tool_error", message: j.error || ("HTTP " + r.status) };
  return j;
}
async function job(tool, input, onTick){
  const r = await fetch("api/job/" + tool, { method: "POST", headers: { "Content-Type": "application/json", "X-Shack": "1" }, body: JSON.stringify(input || {}) });
  const j = await r.json();
  if (!r.ok) throw { code: "tool_error", message: j.error || ("HTTP " + r.status) };
  for (;;) {
    await new Promise(res => setTimeout(res, 2000));
    const s = await (await fetch("api/job/" + j.job, { headers: { "X-Shack": "1" } })).json();
    onTick && onTick(s);
    if (s.state === "done") return s.result;
    if (s.state === "error") throw { code: "tool_error", message: s.error };
    if (s.error) throw { code: "tool_error", message: s.error + " (ο server επανεκκίνησε;)" };
  }
}
function errCopy(e){
  switch (e && e.code) {
    case "needs_reauth": return t("Δεν επιτρέπεται η πρόσβαση. Ξανασυνδέσου.");
    case "server_unavailable": return t("Ο server δεν απαντά.");
    default: return (e && (e.message || e.code)) || t("άγνωστο σφάλμα");
  }
}
function toast(msg, ms = 3500){
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  $("toast-root").replaceChildren(t); setTimeout(() => t.remove(), ms);
}
function stamp(id){ $(id).textContent = t("ενημ. ") + new Date().toLocaleTimeString(LOCALE, {hour:"2-digit", minute:"2-digit", second:"2-digit"}); }
function setPill(id, cls, text){ const el = $(id); el.className = "pill " + cls; el.textContent = text; }
const timers = {};
function poll(key, tool, input, onData, bodyId, freshId, interval){
  clearInterval(timers[key]);
  const run = async () => {
    try { const p = await api(tool, typeof input === "function" ? input() : input); $(bodyId).dataset.loaded = "1"; freshId && stamp(freshId); onData(p); }
    catch (e) { const box = $(bodyId); if (!box.dataset.loaded) box.innerHTML = `<div class="err">${esc(errCopy(e))}</div>`; }
  };
  run();
  if (interval) timers[key] = setInterval(() => { if (!document.hidden) run(); }, interval);
}

    try {
      const r = await api("codeplug_sync_wpsd", { codeplug: state.codeplug, extra_talkgroups: extra });
      const a = r.applied || {};
      $("sync-msg").textContent = r.changed ? `${t("Έγινε:")} ${(a.created||[]).length} ${t("νέα,")} ${(a.updated||[]).length} ${t("ενημερωμένα,")} ${(a.removed||[]).length} ${t("αφαιρέθηκαν")}${r.validation && !r.validation.ok ? t(" · ΠΡΟΣΟΧΗ: αποτυχία ελέγχου") : t(" · έλεγχος OK")}.` : t("Ήταν ήδη σε συμφωνία.");
      reloadCodeplug();

/* ---------------- codeplug: loading ---------------- */
function renderList(p){
  const ws = (p && p.workspace) || [];
  state.ws = ws;
  const sel = $("cp-select");
  if (!ws.length){ sel.innerHTML = "<option>—</option>"; $("cp-body").innerHTML = `<div class="empty">${t("Δεν υπάρχει codeplug ακόμα. Πάτα «Read» με τον ασύρματο συνδεδεμένο στον server.")}</div>`; return; }
  const names = ws.map(w => w.name);
  if (!state.codeplug || !names.includes(state.codeplug))
    state.codeplug = ["current", "last-read"].find(n => names.includes(n)) || [...ws].sort((a,b) => b.modified - a.modified)[0].name;
  sel.innerHTML = names.map(n => `<option ${n === state.codeplug ? "selected" : ""}>${esc(n)}</option>`).join("");
  const w = ws.find(x => x.name === state.codeplug);
  $("cp-meta").textContent = w ? `${t("Αρχείο")} ${w.name} ${t("· τελευταία αλλαγή")} ${new Date(w.modified * 1000).toLocaleString(LOCALE)}` + (w.name !== "current" ? t(" · ΠΡΟΣΟΧΗ: επεξεργάζεσαι αρχείο που δεν είναι το current") : "") : "";
  reloadCodeplug();
}
async function reloadCodeplug(){
  if (!state.codeplug) return;
  const cp = state.codeplug;
  try {
    const [zones, channels, contacts, gls, scans] = await Promise.all(
      ["zones", "channels", "contacts", "groupLists", "scanLists"].map(sec => api("codeplug_get", { codeplug: cp, section: sec, limit: 5000 }).then(r => r.entries || [])));
    state.cp = { zones, channels, contacts, groupLists: gls, scanLists: scans,
      chById: Object.fromEntries(channels.map(c => [c.id, c])), ctById: Object.fromEntries(contacts.map(c => [c.id, c])),
      glById: Object.fromEntries(gls.map(g => [g.id, g])) };
    renderCodeplug();
    api("wpsd_sync_status", { codeplug: cp }).then(renderSync).catch(() => {});
  } catch (e) { $("cp-body").innerHTML = `<div class="err">${esc(errCopy(e))}</div>`; }
}
function renderCodeplug(){
  document.querySelectorAll('.tabs [role=tab]').forEach(b => b.setAttribute("aria-selected", b.dataset.tab === state.tab));
  const r = { zones: renderZones, channels: renderChannels, contacts: renderContacts, grouplists: renderGroupLists, scanlists: renderScanLists, fm: renderFM, rpt: renderRpt, preset: renderPresets }[state.tab];
  r();
}
function chanRow(c, extra = ""){
  const dmr = c.kind === "dmr";
  const ct = state.cp.ctById[c.contact];
  const tone = c.txTone && typeof c.txTone === "object" ? (c.txTone.ctcss || (c.txTone.dcs != null ? "DCS " + c.txTone.dcs : "")) : "";
  return `<tr class="rowbtn" data-ch="${esc(c.id)}"><td>${esc(c.name)}</td><td class="num">${esc(fmtF(c.rxFrequency))}</td><td class="num">${esc(fmtF(c.txFrequency))}</td>
    <td>${dmr ? `DMR <span class="ts">${esc(c.timeSlot || "")}</span> <span class="note">CC${esc(c.colorCode ?? "")}</span>` : `FM <span class="note">${esc(c.bandwidth || "")}</span>`}</td>
    <td class="num">${dmr ? (ct ? `${esc(ct.number)} <span class="note">${esc(ct.name)}</span>` : "—") : esc(tone || "—")}</td>
    <td class="note">${esc(c.power && c.power !== "!default" ? c.power : "")}</td>${extra}</tr>`;
}

function renderZones(){
  const { zones, chById } = state.cp;
  const inZone = new Set(zones.flatMap(z => [...(z.A || []), ...(z.B || [])]));
  const loose = state.cp.channels.filter(c => !inZone.has(c.id));
  const list = zones.map(z => ({ id: z.id, name: z.name, chans: [...(z.A || []), ...(z.B || [])], real: true }));
  if (loose.length) list.push({ id: "__loose", name: t("Χωρίς zone"), chans: loose.map(c => c.id) });
  if (!list.find(z => z.id === state.zone)) state.zone = (list.find(z => /wpsd/i.test(z.name)) || list[0] || {}).id;
  const zone = list.find(z => z.id === state.zone);
  const rows = (zone ? zone.chans : []).map(id => chById[id]).filter(Boolean);
  $("cp-body").innerHTML = `
    <div class="cpgrid">
      <div>
        <div class="row" style="margin-bottom:6px"><button class="small primary" id="btn-zone-new">+ Zone</button>${zone && zone.real ? `<button class="small" id="btn-zone-ren">${t("Μετονομασία")}</button><button class="small danger" id="btn-zone-del">${t("Διαγραφή")}</button>` : ""}</div>
        <nav class="zones">${list.map(z => `<button type="button" data-z="${esc(z.id)}" aria-pressed="${z.id === state.zone}"><span>${esc(z.name)}${/wpsd/i.test(z.name) ? ' <span class="managed">SYNC</span>' : ""}</span><span class="n">${z.chans.length}</span></button>`).join("")}</nav>
      </div>
      <div>
        <div class="row" style="margin-bottom:6px">
          <span class="label">${esc(zone ? zone.name : "")} · ${rows.length} ${t("κανάλια")}</span><span class="grow"></span>
          ${zone && zone.real ? `<button class="small" id="btn-zone-add">${t("+ Υπάρχον κανάλι")}</button><button class="small primary" id="btn-ch-new">${t("+ Νέο κανάλι")}</button>` : ""}
        </div>
        <div class="tablewrap">${rows.length ? `<table>${CH_HEAD.replace("%EXTRA%", "<th></th>")}<tbody>${rows.map((c, i) => chanRow(c, zone.real ? `<td class="acts"><button class="small" data-mv="${i}:-1" title="${t("Πάνω")}">↑</button><button class="small" data-mv="${i}:1" title="${t("Κάτω")}">↓</button><button class="small" data-rm="${esc(c.id)}" title="${t("Αφαίρεση από τη zone")}">✕</button></td>` : "<td></td>")).join("")}</tbody></table>` : `<div class="empty">${t("Η zone είναι άδεια.")}</div>`}</div>
      </div>
    </div>`;
  $("cp-body").querySelectorAll("[data-z]").forEach(b => b.onclick = () => { state.zone = b.dataset.z; renderZones(); });
  $("cp-body").querySelectorAll("tr[data-ch]").forEach(tr => tr.onclick = (e) => { if (e.target.closest("button")) return; openChannel(tr.dataset.ch); });
  const zid = state.zone;
  $("cp-body").querySelectorAll("[data-mv]").forEach(b => b.onclick = async () => {
    const [i, d] = b.dataset.mv.split(":").map(Number); const ids = zone.chans.slice(); const j = i + d;
    if (j < 0 || j >= ids.length) return; [ids[i], ids[j]] = [ids[j], ids[i]];
    await edit("codeplug_zone_set", { codeplug: state.codeplug, zone: zid, channels: ids, mode: "replace" });
  });
  $("cp-body").querySelectorAll("[data-rm]").forEach(b => b.onclick = () => edit("codeplug_zone_set", { codeplug: state.codeplug, zone: zid, channels: [b.dataset.rm], mode: "remove" }));
  $("btn-zone-new").onclick = () => prompt1(t("Νέα zone"), t("Όνομα (έως 16 χαρ.)"), "", async (name) => { const r = await edit("codeplug_upsert", { codeplug: state.codeplug, section: "zones", entry: { name: name.slice(0, 16), A: [], B: [] } }); state.zone = r.id; renderZones(); });
  if (zone && zone.real) {
    $("btn-zone-ren").onclick = () => prompt1(t("Μετονομασία zone"), t("Νέο όνομα"), zone.name, (name) => edit("codeplug_upsert", { codeplug: state.codeplug, section: "zones", entry: { id: zid, name: name.slice(0, 16) } }));
    $("btn-zone-del").onclick = () => confirmBox(`${t("Διαγραφή της zone «")}${zone.name}${t("»; Τα κανάλια της μένουν στο codeplug.")}`, () => edit("codeplug_delete", { codeplug: state.codeplug, section: "zones", ids: [zid] }).then(() => { state.zone = null; }));
    $("btn-zone-add").onclick = () => pickChannels(zone.chans, (ids) => edit("codeplug_zone_set", { codeplug: state.codeplug, zone: zid, channels: ids, mode: "append" }));
    $("btn-ch-new").onclick = () => openChannel(null, zid);
  }
}

      if (!(await radioPresent())) throw { message: NO_RADIO };

        } catch (e) { opBox(`<div class="err">${t("Η εγγραφή απέτυχε:")} ${esc(errCopy(e))}</div>`); }
        finally { state.busy = false; }
      };
      return;
    } catch (e) { opBox(`<div class="err">${esc(errCopy(e))}</div>`); state.busy = false; }
  };

const rptState = { country: "Greece", region: "", band: "any", results: [], errors: [], attribution: null, searched: false, live: null };

  const d = new Date(L.last_seen.replace(" ", "T") + "Z"); const days = (Date.now() - d) / 86400000;

}

  $("rp-search").onclick = async () => {

  const selN = () => { const n = $("cp-body").querySelectorAll(".rp-sel:checked").length; $("rp-add").disabled = !n; $("rp-n").textContent = n ? `${n} ${t("επιλεγμένα")}` : ""; };

  $("rp-all").onchange = (e) => { $("cp-body").querySelectorAll(".rp-sel:not(:disabled)").forEach(c => c.checked = e.target.checked); selN(); };
  $("rp-add").onclick = () => {
    const sel = [...$("cp-body").querySelectorAll(".rp-sel:checked")].map(c => R[+c.dataset.i]);
    const zoneDefault = (rptState.region || rptState.country).slice(0, 12) + " DMR";
    drawer(t("Προσθήκη αναμεταδοτών"), `<div class="form">
        <label class="full">${t("Zone")}<input type="text" id="rp-zone" value="${esc(zoneDefault)}" maxlength="16"></label>
        <label class="full">${t("Talkgroups (TG:TS, χωρισμένα με κόμμα)")}<input type="text" id="rp-tgs" value="202:2, 9:2" placeholder="202:2, 9:2"></label>
        <label><input type="checkbox" id="rp-roam" checked> ${t("Roaming zone")}</label>
        <label><input type="checkbox" id="rp-fm" checked> ${t("Και FM κανάλι όπου υπάρχει")}</label>
        <div class="note">${sel.length} ${t("αναμεταδότες")} × ${t("TG")} → ${t("κανάλια «<διακριτικό> <TG>», μία zone, μία roaming zone. Τα κανάλια γράφονται στον ασύρματο με Write.")}</div></div>`,
      `<button id="rp-go" class="primary">${t("Προσθήκη")}</button>`);
    $("rp-go").onclick = async () => {
      const tgs = $("rp-tgs").value.split(",").map(x => x.trim()).filter(Boolean).map(x => { const [tg, ts] = x.split(":"); return { tg: +tg, ts: +(ts || 2) }; }).filter(x => x.tg > 0);
      if (!tgs.length) { drMsg(t("Δώσε τουλάχιστον ένα TG"), true); return; }
      $("rp-go").disabled = true;
      try {
        const r = await api("codeplug_import_region", { codeplug: state.codeplug, zone: $("rp-zone").value.trim() || zoneDefault, country: rptState.country, repeaters: sel, talkgroups: tgs, roaming: $("rp-roam").checked, include_fm: $("rp-fm").checked, max_repeaters: 200 });

/* ---------------- drawer helpers ---------------- */
function drawer(title, bodyHtml, actionsHtml){
  $("drawer-root").innerHTML = `<div class="scrim" id="scrim"></div><aside class="drawer" role="dialog" aria-label="${esc(title)}"><div class="row"><h3 class="grow">${esc(title)}</h3><button class="small" id="dr-close">✕</button></div><div id="dr-body">${bodyHtml}</div><div class="row end" id="dr-actions">${actionsHtml}</div><div id="dr-msg" class="note"></div></aside>`;
  $("scrim").onclick = closeDrawer; $("dr-close").onclick = closeDrawer;
  const first = $("dr-body").querySelector("input,select"); first && first.focus();
}
function closeDrawer(){ $("drawer-root").innerHTML = ""; }
function drMsg(t, bad){ const m = $("dr-msg"); if (m) { m.textContent = t; m.style.color = bad ? "var(--bad)" : "var(--muted)"; } }
function prompt1(title, label, value, onOk){
  drawer(title, `<div class="form"><label class="full">${esc(label)}<input type="text" id="p1" value="${esc(value)}" maxlength="16"></label></div>`, `<button id="p1-ok" class="primary">OK</button>`);
  const go = async () => { const v = $("p1").value.trim(); if (!v) return; try { await onOk(v); closeDrawer(); } catch (e) { drMsg(errCopy(e), true); } };
  $("p1-ok").onclick = go; $("p1").onkeydown = (e) => { if (e.key === "Enter") go(); };
}
function confirmBox(text, onOk){
  drawer(t("Επιβεβαίωση"), `<p>${esc(text)}</p>`, `<button id="cb-ok" class="danger">${t("Ναι")}</button><button id="cb-no">${t("Άκυρο")}</button>`);
  $("cb-no").onclick = closeDrawer; $("cb-ok").onclick = async () => { try { await onOk(); closeDrawer(); } catch (e) { drMsg(errCopy(e), true); } };
}
function pickChannels(exclude, onOk){
  const ex = new Set(exclude || []);
  const opts = state.cp.channels.filter(c => !ex.has(c.id));
  drawer(t("Προσθήκη καναλιών"), `<input type="text" id="pk-f" placeholder="${t("Αναζήτηση")}" style="width:100%"><div class="list" id="pk-list" style="max-height:60vh"></div>`, `<button id="pk-ok" class="primary">${t("Προσθήκη")}</button>`);
  const render = () => { const q = $("pk-f").value.toLowerCase(); $("pk-list").innerHTML = opts.filter(c => !q || c.name.toLowerCase().includes(q)).slice(0, 300).map(c => `<label><input type="checkbox" value="${esc(c.id)}"> ${esc(c.name)} <span class="note mono">${esc(fmtF(c.rxFrequency))}</span></label>`).join(""); };
  render(); $("pk-f").oninput = render;
  $("pk-ok").onclick = async () => { const ids = [...$("pk-list").querySelectorAll("input:checked")].map(i => i.value); if (!ids.length) return; try { await onOk(ids); closeDrawer(); } catch (e) { drMsg(errCopy(e), true); } };
}
async function edit(tool, input){
  const r = await api(tool, input);
  await reloadCodeplug();
  return r;
}
const sel = (id, opts, cur, allowNone) => `<select id="${id}">${allowNone ? `<option value="">—</option>` : ""}${opts.map(o => `<option value="${esc(o.v)}" ${String(o.v) === String(cur ?? "") ? "selected" : ""}>${esc(o.t)}</option>`).join("")}</select>`;
const POWER = ["", "Min", "Low", "Mid", "High", "Max"];

/* ---------------- channel editor ---------------- */
async function openChannel(chId, zoneId){
  let c = { kind: "dmr", name: "", rxFrequency: "", txFrequency: "", colorCode: 1, timeSlot: "TS1", power: "" };
  if (chId) {
    const r = await api("codeplug_get", { codeplug: state.codeplug, section: "channels", ids: [chId], full: true });
    c = r.entries[0]; if (!c) return;
  }
  const isNew = !chId;
  const dmr = c.kind === "dmr";
  const toneVal = (t) => t && typeof t === "object" ? (t.ctcss ? String(t.ctcss).replace(" Hz", "") : (t.dcs != null ? "D" + t.dcs : "")) : "";
  const body = `
    <div class="form">
      <label class="full">${t("Όνομα (έως 16)")}<input type="text" id="f-name" value="${esc(c.name)}" maxlength="16"></label>
      <label>${t("Τύπος")}${sel("f-kind", [{v:"dmr",t:"DMR"},{v:"fm",t:t("FM (αναλογικό)")}], c.kind)}</label>
      <label>${t("Ισχύς")}${sel("f-power", POWER.map(p => ({v:p, t:p || t("προεπιλογή")})), c.power && c.power !== "!default" ? c.power : "")}</label>
      <label>RX (MHz)<input type="number" id="f-rx" step="0.000125" value="${esc(numF(c.rxFrequency) ?? "")}"></label>
      <label>TX (MHz)<input type="number" id="f-tx" step="0.000125" value="${esc(numF(c.txFrequency) ?? "")}"></label>
      <div id="f-dmr" class="form full" style="grid-column:1/-1;display:${dmr ? "grid" : "none"}">
        <label>Color code<input type="number" id="f-cc" min="0" max="15" value="${esc(c.colorCode ?? 1)}"></label>
        <label>Time slot${sel("f-ts", [{v:"TS1",t:"TS1"},{v:"TS2",t:"TS2"}], c.timeSlot || "TS1")}</label>
        <label class="full">TX contact / talkgroup${sel("f-contact", state.cp.contacts.map(x => ({v:x.id, t:`${x.number} · ${x.name}`})), c.contact, true)}</label>
        <label class="full">RX group list${sel("f-gl", state.cp.groupLists.map(g => ({v:g.id, t:g.name})), c.groupList, true)}</label>
        <label>Admit${sel("f-admit", [{v:"Always",t:"Always"},{v:"Free",t:"Channel free"},{v:"ColorCode",t:"Color code"}], c.admit || "ColorCode")}</label>
      </div>
      <div id="f-fm" class="form full" style="grid-column:1/-1;display:${dmr ? "none" : "grid"}">
        <label>Bandwidth${sel("f-bw", [{v:"Narrow",t:"Narrow 12.5"},{v:"Wide",t:"Wide 25"}], c.bandwidth || "Wide")}</label>
        <label>Admit${sel("f-admit-fm", [{v:"Always",t:"Always"},{v:"Free",t:"Channel free"},{v:"Tone",t:"Tone"}], c.admit || "Always")}</label>
        <label>${t("TX tone (CTCSS Hz ή Dnnn)")}<input type="text" id="f-txtone" value="${esc(toneVal(c.txTone))}" placeholder="${t("88.5 ή D023")}"></label>
        <label>RX tone<input type="text" id="f-rxtone" value="${esc(toneVal(c.rxTone))}" placeholder="${t("κενό = χωρίς")}"></label>
      </div>
      <label class="full">Scan list${sel("f-scan", state.cp.scanLists.map(s => ({v:s.id, t:s.name})), c.scanList, true)}</label>
      <label class="check full"><input type="checkbox" id="f-rxonly" ${c.rxOnly ? "checked" : ""}> ${t("Μόνο λήψη (RX only)")}</label>
      ${!isNew ? `<div class="full note">Zones: ${esc(zonesOf(chId).join(", ") || t("καμία"))} · id ${esc(chId)}</div>` : ""}
    </div>`;
  drawer(isNew ? t("Νέο κανάλι") : t("Κανάλι"), body, `${!isNew ? `<button id="f-del" class="danger">${t("Διαγραφή")}</button>` : ""}<span class="grow"></span><button id="f-save" class="primary">${t("Αποθήκευση")}</button>`);
  $("f-kind").onchange = () => { const d = $("f-kind").value === "dmr"; $("f-dmr").style.display = d ? "grid" : "none"; $("f-fm").style.display = d ? "none" : "grid"; };
  $("f-rx").onchange = () => { if (!$("f-tx").value) $("f-tx").value = $("f-rx").value; };
  const parseTone = (s) => { s = (s || "").trim(); if (!s) return null; if (/^d/i.test(s)) { const n = parseInt(s.slice(1), 10); return Number.isFinite(n) ? { dcs: n } : null; } const f = parseFloat(s); return Number.isFinite(f) ? { ctcss: f.toFixed(1) + " Hz" } : null; };
  $("f-save").onclick = async () => {
    const kind = $("f-kind").value, name = $("f-name").value.trim();
    const rx = parseFloat($("f-rx").value), tx = parseFloat($("f-tx").value || $("f-rx").value);
    if (!name || !Number.isFinite(rx) || !Number.isFinite(tx)) { drMsg(t("Χρειάζεται όνομα, RX και TX."), true); return; }
    const entry = { name, rxFrequency: rx, txFrequency: tx, rxOnly: $("f-rxonly").checked, power: $("f-power").value || null, scanList: $("f-scan").value || null };
    if (kind === "dmr") Object.assign(entry, { colorCode: parseInt($("f-cc").value, 10) || 0, timeSlot: $("f-ts").value, contact: $("f-contact").value || null, groupList: $("f-gl").value || null, admit: $("f-admit").value });
    else Object.assign(entry, { bandwidth: $("f-bw").value, admit: $("f-admit-fm").value, txTone: parseTone($("f-txtone").value), rxTone: parseTone($("f-rxtone").value) });
    if (!isNew && kind !== c.kind) { drMsg(t("Η αλλαγή τύπου DMR↔FM δεν υποστηρίζεται σε υπάρχον κανάλι. Φτιάξε νέο."), true); return; }
    if (!isNew) entry.id = chId;
    try {
      drMsg(t("Αποθηκεύω…"));
      const r = await api("codeplug_upsert", { codeplug: state.codeplug, section: "channels", entry, kind });
      if (isNew && zoneId) await api("codeplug_zone_set", { codeplug: state.codeplug, zone: zoneId, channels: [r.id], mode: "append" });
      closeDrawer(); toast(isNew ? t("Το κανάλι δημιουργήθηκε.") : t("Αποθηκεύτηκε.")); reloadCodeplug();
    } catch (e) { drMsg(errCopy(e), true); }
  };
  if (!isNew) $("f-del").onclick = () => confirmBox(`${t("Διαγραφή του καναλιού «")}${c.name}${t("» από το codeplug και από όλες τις zones;")}`, () => edit("codeplug_delete", { codeplug: state.codeplug, section: "channels", ids: [chId] }).then(() => toast(t("Διαγράφηκε."))));
}

/* ---------------- browser serial bridge (Web Serial -> WebSocket -> pty on the server) ---------------- */
const bridge = { port: null, ws: null, reader: null, writer: null, up: false, wanted: false, stats: { tx: 0, rx: 0 } };
async function bridgeToggle(){
  if (bridge.up || bridge.wanted) { bridge.wanted = false; await bridgeStop(t("κλείσιμο από τον χρήστη")); return; }
  if (!("serial" in navigator)) { opBox(`<div class="err">${t("Ο browser δεν υποστηρίζει Web Serial. Χρειάζεται Chrome ή Edge σε υπολογιστή (όχι Firefox/Safari/κινητό).")}</div>`); return; }
  let port;
  try { port = await navigator.serial.requestPort({ filters: [{ usbVendorId: 0x28e9 }] }); }
  catch (e) { return; } // user cancelled the chooser
  bridge.wanted = true;
  await bridgeOpen(port, true);
}
// The radio reboots after every programming session (the port vanishes for ~10-20 s). While the user wants the
// bridge, re-open the (already permitted) port as soon as it is back, so a write can follow its safety-backup read.
async function bridgeReconnect(){
  const t0 = Date.now();
  toast(t("Ο ασύρματος επανεκκινεί — περιμένω να επανέλθει…"));
  while (bridge.wanted && !bridge.up && Date.now() - t0 < 120000) {
    await new Promise(r => setTimeout(r, 1500));
    let ports = [];
    try { ports = await navigator.serial.getPorts(); } catch {}
    for (const p of ports) {
      const info = p.getInfo ? p.getInfo() : {};
      if (info.usbVendorId && info.usbVendorId !== 0x28e9) continue;
      if (await bridgeOpen(p, false)) { toast(t("Ο ασύρματος επανήλθε — γέφυρα ενεργή ξανά.")); return; }
    }
  }
  if (bridge.wanted && !bridge.up) { bridge.wanted = false; toast(t("Ο ασύρματος δεν επανήλθε· πάτα ξανά «⚡ Σύνδεση».")); radioDetect(); }
}
async function bridgeOpen(port, announce){
  try {
    await port.open({ baudRate: 115200, bufferSize: 65536 });
    bridge.port = port;
    const url = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + location.pathname.replace(/\/$/, "") + "/ws/serial?shack=1";
    const ws = new WebSocket(url); ws.binaryType = "arraybuffer";
    bridge.ws = ws;
    await new Promise((res, rej) => { ws.onopen = res; ws.onerror = () => rej(new Error("WebSocket")); ws.onclose = (e) => rej(new Error(t("WebSocket κλειστό ") + e.code)); });
    bridge.writer = port.writable.getWriter();
    bridge.up = true; radioButtons(true); bridge.stats = { tx: 0, rx: 0 };
    ws.onmessage = async (e) => {
      if (typeof e.data === "string") return;
      const u8 = new Uint8Array(e.data); bridge.stats.tx += u8.length;
      try { await bridge.writer.write(u8); } catch (err) { bridgeStop(t("σφάλμα εγγραφής στη θύρα")); }
    };
    ws.onclose = () => { if (bridge.up) bridgeStop(t("ο server έκλεισε τη σύνδεση")); };
    (async () => {
      // Web Serial reports recoverable errors (buffer overrun, framing, parity) by erroring the current readable
      // stream; port.readable is then a fresh stream and reading can continue. Only a closed/unplugged port ends it.
      while (bridge.up && bridge.port && bridge.port.readable) {
        bridge.reader = bridge.port.readable.getReader();
        try {
          for (;;) { const { value, done } = await bridge.reader.read(); if (done) break; if (value && value.length) { bridge.stats.rx += value.length; if (ws.readyState === 1) ws.send(value); } }
        } catch (err) {
          bridge.stats.errors = (bridge.stats.errors || 0) + 1; console.warn("serial read error", err);
          if (ws.readyState === 1) ws.send(JSON.stringify({ type: "read_error", name: err && err.name, message: String(err && err.message || err) }));
        } finally { try { bridge.reader.releaseLock(); } catch {} }
      }
      if (bridge.up) bridgeStop(t("ο ασύρματος αποσυνδέθηκε"));
    })();
    port.addEventListener("disconnect", () => { if (bridge.up) bridgeStop(t("ο ασύρματος αποσυνδέθηκε")); });
    $("btn-bridge").textContent = t("⚡ Αποσύνδεση"); $("btn-bridge").classList.add("primary");
    setPill("pill-radio", "ok", t("Ασύρματος: μέσω browser"));
    if (announce) opBox(`<div class="okbox">${t("Ο ασύρματος είναι συνδεδεμένος μέσα από αυτόν τον browser. Τα Read/Write περνούν τώρα από εδώ. Μετά από κάθε read/write ο ασύρματος κάνει επανεκκίνηση και η γέφυρα ξανασυνδέεται μόνη της. Μην κλείσεις την καρτέλα όσο γίνεται read ή write.")} <button class="small" onclick="document.getElementById('radio-op').hidden=true">✕</button></div>`);
    return true;
  } catch (e) {
    await bridgeStop(null);
    if (announce) opBox(`<div class="err">${t("Δεν άνοιξε η θύρα:")} ${esc(e && e.message || e)}${t(". Αν η θύρα είναι ανοιχτή στο CPS, κλείσ' το πρώτα.")}</div>`);
    return false;
  }
}
async function bridgeStop(reason){
  const wasUp = bridge.up;
  bridge.up = false; if (!bridge.wanted) radioDetect();
  try { bridge.reader && await bridge.reader.cancel(); } catch {}
  try { bridge.writer && bridge.writer.releaseLock(); } catch {}
  try { bridge.ws && bridge.ws.close(); } catch {}
  try { bridge.port && await bridge.port.close(); } catch {}
  bridge.port = bridge.ws = bridge.reader = bridge.writer = null;
  if (bridge.wanted && wasUp) { setPill("pill-radio", "warn", t("Ασύρματος: επανεκκίνηση…")); bridgeReconnect(); return; }
  $("btn-bridge").textContent = t("⚡ Σύνδεση"); $("btn-bridge").classList.remove("primary");
  if (reason) { toast(t("Γέφυρα ασυρμάτου: ") + reason); radioDetect(); }
}
async function radioPresent(){
  if (bridge.up) return true;
  if (bridge.wanted) { // reconnecting after a reboot: give it a moment
    for (let i = 0; i < 40 && !bridge.up; i++) await new Promise(r => setTimeout(r, 1000));
    return bridge.up;
  }
  try { const r = await api("radio_detect"); return !!r.ok; } catch { return false; }
}

    toast(t("Μετατρέπω το .rdt…"), 8000);
    try {
      const r = await fetch(`api/import/rdt?name=${encodeURIComponent(f.name)}&shack=1`, { method: "POST", headers: { "X-Shack": "1" }, body: f });
      const j = await r.json();
      if (!r.ok || !j.ok) throw { message: j.error || j.messages || "import failed" };
      state.codeplug = j.target; await refreshList(); toast(t("Εισαγωγή OK: ") + j.target);
    } catch (err) { toast(t("Η εισαγωγή απέτυχε: ") + errCopy(err), 8000); }
  };
  $("btn-revert").onclick = restorePicker;
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDrawer(); });
}
boot();
</script>
</body></html>
